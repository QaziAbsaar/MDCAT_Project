<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e65100;stop-opacity:1" />
    </linearGradient>
    <pattern id="pattern1" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M25,0 L25,50 M0,25 L50,25" stroke="rgba(255,255,255,0.1)" stroke-width="1" fill="none" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" />
  <rect width="100%" height="100%" fill="url(#pattern1)" />
  
  <!-- English/Language symbols -->
  <g fill="rgba(255,255,255,0.2)">
    <!-- Open book -->
    <path d="M350,120 C300,100 250,120 250,150 L250,250 C250,220 300,200 350,220 L350,120 Z" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="rgba(255,255,255,0.1)" />
    <path d="M450,120 C500,100 550,120 550,150 L550,250 C550,220 500,200 450,220 L450,120 Z" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="rgba(255,255,255,0.1)" />
    <path d="M350,120 L450,120" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <path d="M350,220 L450,220" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    
    <!-- Text lines in book -->
    <line x1="270" y1="150" x2="330" y2="150" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="270" y1="160" x2="330" y2="160" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="270" y1="170" x2="330" y2="170" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="270" y1="180" x2="330" y2="180" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="270" y1="190" x2="310" y2="190" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    
    <line x1="470" y1="150" x2="530" y2="150" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="470" y1="160" x2="530" y2="160" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="470" y1="170" x2="530" y2="170" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="470" y1="180" x2="530" y2="180" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="470" y1="190" x2="510" y2="190" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    
    <!-- Pen -->
    <path d="M150,200 L200,150 L210,160 L160,210 Z" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="rgba(255,255,255,0.2)" />
    <line x1="150" y1="200" x2="140" y2="210" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    
    <!-- Quotation marks -->
    <text x="650" y="150" font-family="Arial, sans-serif" font-size="60" fill="rgba(255,255,255,0.4)">"</text>
    <text x="680" y="150" font-family="Arial, sans-serif" font-size="60" fill="rgba(255,255,255,0.4)">"</text>
    <text x="650" y="200" font-family="Arial, sans-serif" font-size="60" fill="rgba(255,255,255,0.3)">.</text>
  </g>
  
  <!-- Text -->
  <text x="400" y="350" font-family="Arial, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="rgba(255,255,255,0.7)">ENGLISH</text>
</svg>