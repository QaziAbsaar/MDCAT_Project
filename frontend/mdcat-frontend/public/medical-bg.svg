<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976d2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
    <pattern id="pattern1" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M25,0 L50,25 L25,50 L0,25 Z" fill="rgba(255,255,255,0.1)" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" />
  <rect width="100%" height="100%" fill="url(#pattern1)" />
  
  <!-- Medical symbols -->
  <g fill="rgba(255,255,255,0.2)">
    <!-- Caduceus symbol -->
    <path d="M600,100 C580,120 580,150 600,170 C620,150 620,120 600,100 Z" />
    <path d="M580,135 L620,135" />
    <path d="M590,115 C570,135 570,155 590,175" />
    <path d="M610,115 C630,135 630,155 610,175" />
    <path d="M600,170 L600,220" />
    
    <!-- Heartbeat line -->
    <path d="M300,300 L350,300 L370,250 L390,350 L410,300 L460,300" stroke="rgba(255,255,255,0.3)" stroke-width="5" fill="none" />
    
    <!-- DNA helix -->
    <path d="M800,200 C850,220 750,240 800,260 C850,280 750,300 800,320" stroke="rgba(255,255,255,0.3)" stroke-width="5" fill="none" />
    <path d="M800,200 C750,220 850,240 800,260 C750,280 850,300 800,320" stroke="rgba(255,255,255,0.3)" stroke-width="5" fill="none" />
    <line x1="800" y1="200" x2="800" y2="320" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="5,5" />
    <line x1="775" y1="220" x2="825" y2="220" stroke="rgba(255,255,255,0.3)" stroke-width="3" />
    <line x1="775" y1="260" x2="825" y2="260" stroke="rgba(255,255,255,0.3)" stroke-width="3" />
    <line x1="775" y1="300" x2="825" y2="300" stroke="rgba(255,255,255,0.3)" stroke-width="3" />
    
    <!-- Medical cross -->
    <path d="M500,400 L500,450 L450,450 L450,500 L500,500 L500,550 L550,550 L550,500 L600,500 L600,450 L550,450 L550,400 Z" />
  </g>
  
  <!-- Text -->
  <text x="600" y="500" font-family="Arial, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="rgba(255,255,255,0.7)">MDCAT PREPARATION</text>
</svg>