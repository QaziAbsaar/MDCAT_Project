<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b5e20;stop-opacity:1" />
    </linearGradient>
    <pattern id="pattern1" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="5" fill="rgba(255,255,255,0.1)" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" />
  <rect width="100%" height="100%" fill="url(#pattern1)" />
  
  <!-- Biology symbols -->
  <g fill="rgba(255,255,255,0.2)">
    <!-- DNA helix -->
    <path d="M400,50 C450,70 350,90 400,110 C450,130 350,150 400,170 C450,190 350,210 400,230" stroke="rgba(255,255,255,0.4)" stroke-width="5" fill="none" />
    <path d="M400,50 C350,70 450,90 400,110 C350,130 450,150 400,170 C350,190 450,210 400,230" stroke="rgba(255,255,255,0.4)" stroke-width="5" fill="none" />
    <line x1="375" y1="70" x2="425" y2="70" stroke="rgba(255,255,255,0.4)" stroke-width="3" />
    <line x1="375" y1="110" x2="425" y2="110" stroke="rgba(255,255,255,0.4)" stroke-width="3" />
    <line x1="375" y1="150" x2="425" y2="150" stroke="rgba(255,255,255,0.4)" stroke-width="3" />
    <line x1="375" y1="190" x2="425" y2="190" stroke="rgba(255,255,255,0.4)" stroke-width="3" />
    
    <!-- Cell -->
    <circle cx="200" cy="200" r="60" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="rgba(255,255,255,0.1)" />
    <circle cx="200" cy="200" r="20" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="rgba(255,255,255,0.2)" />
    <ellipse cx="220" cy="180" rx="10" ry="15" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="rgba(255,255,255,0.2)" />
    <path d="M170,170 C180,160 190,180 200,170" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" />
    
    <!-- Leaf -->
    <path d="M600,150 C650,100 700,150 650,200 C700,250 650,300 600,250 C550,300 500,250 550,200 C500,150 550,100 600,150 Z" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="rgba(255,255,255,0.1)" />
    <path d="M600,150 L600,250" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none" />
    <path d="M550,200 L650,200" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none" />
  </g>
  
  <!-- Text -->
  <text x="400" y="350" font-family="Arial, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="rgba(255,255,255,0.7)">BIOLOGY</text>
</svg>