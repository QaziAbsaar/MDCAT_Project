<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a148c;stop-opacity:1" />
    </linearGradient>
    <pattern id="pattern1" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M0,0 L50,50 M50,0 L0,50" stroke="rgba(255,255,255,0.1)" stroke-width="1" fill="none" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" />
  <rect width="100%" height="100%" fill="url(#pattern1)" />
  
  <!-- Chemistry symbols -->
  <g fill="rgba(255,255,255,0.2)">
    <!-- Atom symbol -->
    <circle cx="400" cy="150" r="15" fill="rgba(255,255,255,0.5)" />
    <ellipse cx="400" cy="150" rx="80" ry="30" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none" />
    <ellipse cx="400" cy="150" rx="80" ry="30" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none" transform="rotate(60 400 150)" />
    <ellipse cx="400" cy="150" rx="80" ry="30" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none" transform="rotate(120 400 150)" />
    
    <!-- Flask -->
    <path d="M200,100 L180,200 C180,230 220,230 220,200 L200,100" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="rgba(255,255,255,0.1)" />
    <line x1="190" y1="100" x2="210" y2="100" stroke="rgba(255,255,255,0.4)" stroke-width="3" />
    <path d="M185,170 L215,170" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="3,3" />
    
    <!-- Beaker -->
    <path d="M600,120 L600,220 C600,230 650,230 650,220 L650,120" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="rgba(255,255,255,0.1)" />
    <line x1="590" y1="120" x2="660" y2="120" stroke="rgba(255,255,255,0.4)" stroke-width="3" />
    <line x1="600" y1="140" x2="650" y2="140" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <line x1="600" y1="160" x2="650" y2="160" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <line x1="600" y1="180" x2="650" y2="180" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <line x1="600" y1="200" x2="650" y2="200" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    
    <!-- Molecule structure -->
    <circle cx="300" cy="300" r="10" fill="rgba(255,255,255,0.4)" />
    <circle cx="340" cy="270" r="10" fill="rgba(255,255,255,0.4)" />
    <circle cx="380" cy="300" r="10" fill="rgba(255,255,255,0.4)" />
    <circle cx="340" cy="330" r="10" fill="rgba(255,255,255,0.4)" />
    <line x1="300" y1="300" x2="340" y2="270" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <line x1="340" y1="270" x2="380" y2="300" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <line x1="380" y1="300" x2="340" y2="330" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <line x1="340" y1="330" x2="300" y2="300" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    
    <!-- Periodic table element -->
    <rect x="500" y="270" width="60" height="60" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="rgba(255,255,255,0.1)" />
    <text x="530" y="295" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="rgba(255,255,255,0.7)">H</text>
    <text x="530" y="315" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.7)">1.008</text>
  </g>
  
  <!-- Text -->
  <text x="400" y="350" font-family="Arial, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="rgba(255,255,255,0.7)">CHEMISTRY</text>
</svg>