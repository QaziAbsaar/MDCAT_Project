<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
    <pattern id="pattern1" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M0,30 L60,30 M30,0 L30,60" stroke="rgba(255,255,255,0.1)" stroke-width="1" fill="none" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" />
  <rect width="100%" height="100%" fill="url(#pattern1)" />
  
  <!-- Physics symbols -->
  <g fill="rgba(255,255,255,0.2)">
    <!-- Atom symbol -->
    <circle cx="400" cy="150" r="15" fill="rgba(255,255,255,0.5)" />
    <ellipse cx="400" cy="150" rx="80" ry="20" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none" />
    <ellipse cx="400" cy="150" rx="80" ry="20" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none" transform="rotate(60 400 150)" />
    <ellipse cx="400" cy="150" rx="80" ry="20" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none" transform="rotate(120 400 150)" />
    
    <!-- Pendulum -->
    <line x1="200" y1="80" x2="200" y2="180" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <circle cx="200" cy="180" r="20" fill="rgba(255,255,255,0.3)" />
    
    <!-- Pulley system -->
    <circle cx="600" cy="100" r="20" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" />
    <line x1="600" y1="80" x2="600" y2="60" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <line x1="580" y1="100" x2="540" y2="150" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <line x1="620" y1="100" x2="660" y2="150" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <rect x="530" y="150" width="20" height="20" fill="rgba(255,255,255,0.3)" />
    <rect x="650" y="150" width="20" height="20" fill="rgba(255,255,255,0.3)" />
    
    <!-- Wave -->
    <path d="M100,250 C130,220 170,280 200,250 C230,220 270,280 300,250 C330,220 370,280 400,250 C430,220 470,280 500,250 C530,220 570,280 600,250 C630,220 670,280 700,250" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none" />
    
    <!-- Formulas -->
    <text x="150" y="320" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="rgba(255,255,255,0.6)">E = mc²</text>
    <text x="300" y="320" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="rgba(255,255,255,0.6)">F = ma</text>
    <text x="450" y="320" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="rgba(255,255,255,0.6)">V = IR</text>
    <text x="600" y="320" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="rgba(255,255,255,0.6)">PV = nRT</text>
  </g>
  
  <!-- Text -->
  <text x="400" y="350" font-family="Arial, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="rgba(255,255,255,0.7)">PHYSICS</text>
</svg>