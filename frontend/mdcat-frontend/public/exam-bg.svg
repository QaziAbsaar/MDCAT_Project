<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#880e4f;stop-opacity:1" />
    </linearGradient>
    <pattern id="pattern1" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="50" height="50" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" />
  <rect width="100%" height="100%" fill="url(#pattern1)" />
  
  <!-- Exam/Test symbols -->
  <g fill="rgba(255,255,255,0.2)">
    <!-- Exam paper -->
    <rect x="250" y="80" width="300" height="200" fill="rgba(255,255,255,0.2)" />
    <rect x="270" y="100" width="260" height="20" fill="rgba(255,255,255,0.1)" />
    
    <!-- Multiple choice options -->
    <circle cx="280" cy="140" r="5" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" />
    <circle cx="280" cy="160" r="5" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" />
    <circle cx="280" cy="180" r="5" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="rgba(255,255,255,0.4)" />
    <circle cx="280" cy="200" r="5" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" />
    
    <line x1="300" y1="140" x2="500" y2="140" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <line x1="300" y1="160" x2="500" y2="160" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <line x1="300" y1="180" x2="500" y2="180" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <line x1="300" y1="200" x2="500" y2="200" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    
    <!-- Question number -->
    <text x="280" cy="120" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.6)">1.</text>
    
    <!-- Clock -->
    <circle cx="650" cy="120" r="40" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="rgba(255,255,255,0.1)" />
    <line x1="650" y1="120" x2="650" y2="90" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <line x1="650" y1="120" x2="670" y2="120" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    
    <!-- Pencil -->
    <path d="M150,120 L200,170 L190,180 L140,130 Z" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="rgba(255,255,255,0.2)" />
    <line x1="140" y1="130" x2="130" y2="120" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    
    <!-- Graduation cap -->
    <rect x="120" y="220" width="80" height="10" fill="rgba(255,255,255,0.3)" />
    <path d="M160,180 L120,200 L160,220 L200,200 Z" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="rgba(255,255,255,0.2)" />
    <line x1="160" y1="220" x2="160" y2="240" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <circle cx="160" cy="240" r="5" fill="rgba(255,255,255,0.3)" />
  </g>
  
  <!-- Text -->
  <text x="400" y="350" font-family="Arial, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="rgba(255,255,255,0.7)">EXAM PREPARATION</text>
</svg>